version: '3.8'
services:
  postgres:
    image: postgres:17
    container_name: postgres17
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dbname
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:6.2
    container_name: redis62
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  app:
    image: php:8.2-fpm
    container_name: app
    build:
      context: .
      dockerfile: Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
      - "9000:9000"
    command: php artisan serve --host=0.0.0.0 --port=8000

volumes:
  pgdata:
  redisdata:
